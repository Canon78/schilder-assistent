<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schilder & Kleurenpalet Assistent (Cloud)</title>
    <!-- Tailwind CSS voor modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .theater-mode { background-color: black !important; }
        .theater-mode header, .theater-mode aside, .theater-mode footer { display: none !important; }
        .theater-mode main { width: 100vw !important; height: 100vh !important; padding: 0 !important; margin: 0 !important; }
        #exitTheaterBtn { display: none; }
        .theater-mode #exitTheaterBtn { display: flex !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col relative">
    <!-- Zwevende knop om theatermodus te verlaten -->
    <button id="exitTheaterBtn" onclick="toggleTheaterMode()" class="fixed top-4 right-4 z-50 bg-red-600/85 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-lg backdrop-blur items-center gap-1.5 transition">
        ✕ Sluit Beamer / Theatermodus
    </button>
    <!-- Modal voor grote weergave eindresultaat -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden p-4">
        <div class="relative max-w-4xl max-h-[90vh]">
            <button onclick="closeModal()" class="absolute -top-10 right-0 bg-red-600 text-white px-3 py-1 rounded text-sm font-bold">Sluiten ✕</button>
            <img id="modalImg" class="max-w-full max-h-[85vh] object-contain rounded border border-slate-700" alt="Eindresultaat groot">
        </div>
    </div>
    <!-- Modal voor Lopende Projecten -->
    <div id="projectsModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-850">
                <h2 class="font-bold text-lg text-slate-200">📁 Mijn Lopende Projecten (<span id="countProjects">0</span>)</h2>
                <button onclick="closeModalByName('projectsModal')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1 rounded text-sm transition">Sluiten ✕</button>
            </div>
            <div id="projectsList" class="p-4 flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Wordt dynamisch gevuld -->
            </div>
        </div>
    </div>
    <!-- Modal voor Afgewerkte Schilderijen -->
    <div id="finishedModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-850">
                <h2 class="font-bold text-lg text-slate-200">🏆 Mijn Afgewerkte Schilderijen (<span id="countFinished">0</span>)</h2>
                <button onclick="closeModalByName('finishedModal')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1 rounded text-sm transition">Sluiten ✕</button>
            </div>
            <div id="finishedList" class="p-4 flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Wordt dynamisch gevuld -->
            </div>
        </div>
    </div>
    <!-- Melding banner (Toast)
